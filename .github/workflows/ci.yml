name: CI Validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Check Formatting
        run: pnpm format

      - name: Start Marketplace Server
        run: |
          cd examples/marketplace
          node src/server.js &
          cd ../..
          sleep 3
        timeout-minutes: 1

      - name: Run Tests (Unit & E2E)
        run: pnpm test

      - name: Build Check
        run: pnpm build

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: '**/playwright-report/'
          retention-days: 7
