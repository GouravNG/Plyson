name: CI Validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playson/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playson

      - name: Security Audit
        run: npm audit --audit-level=high
        working-directory: playson

      - name: Check Formatting
        run: npx prettier --check .
        working-directory: playson

      - name: Run Unit Tests
        run: npm test
        working-directory: playson

      - name: Build Check
        run: npm run build
        working-directory: playson

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: playson

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: playson

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: playson/playwright-report/
          retention-days: 7
